name: mela

services:
  mela-db:
    container_name: mela-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-MelaFair@2026Db!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mela_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-MelaFair@2026Db!}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-MelaFair@2026Db!}\" -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - mela-network

  mela-web:
    container_name: mela-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=mela-db,1433;Database=MelaFairDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-MelaFair@2026Db!};TrustServerCertificate=True;MultipleActiveResultSets=true;
    ports:
      - "5243:8080"
    depends_on:
      mela-db:
        condition: service_healthy
    networks:
      - mela-network

  mela-admin:
    container_name: mela-db-admin
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mela-db
    depends_on:
      - mela-db
    networks:
      - mela-network

volumes:
  mela_sqldata:

networks:
  mela-network:
    driver: bridge
